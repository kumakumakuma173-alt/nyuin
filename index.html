<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>入院管理</title>
<meta name="theme-color" content="#1f7a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="入院管理">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#fbfcfb; --surface:#ffffff; --ink:#16303f; --muted:#5d6f78; --line:#d6dfdb;
  --accent:#1f7a5a; --accent-soft:#e1f0e9; --accent-ink:#ffffff;
  --warn:#b8650a; --warn-soft:#fdf0dc; --crit:#c0392b; --crit-soft:#fbe6e3; --info:#2c5d8a; --info-soft:#e4edf6;
  --shadow:0 10px 30px rgba(22,48,63,.18); --scrim:rgba(10,20,25,.45);
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141e21; --surface:#1b272b; --ink:#e3ece8; --muted:#93a6ad; --line:#2c3b40;
  --accent:#4fb98f; --accent-soft:#183a2e; --accent-ink:#0c1a14;
  --warn:#e8a24a; --warn-soft:#3a2a12; --crit:#ef7466; --crit-soft:#3d1c19; --info:#7fb0dd; --info-soft:#18293a;
  --shadow:0 10px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
html{touch-action:manipulation}
input,textarea,select{font-size:16px!important}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.appbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.appbar h1{margin:0;font-size:19px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:none;font-size:26px;line-height:1;padding:0 6px 0 0;color:var(--accent)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px}
.main{flex:1;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 8px)}
.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:none;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;position:relative}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabbar .badge{position:absolute;top:0;left:calc(50% + 6px)}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;line-height:18px;padding:0 5px;font-family:var(--f-num);display:inline-block;text-align:center}
.sec{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:16px 2px 6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;border-radius:6px;padding:2px 8px;font-weight:700;white-space:nowrap}
.c-ok{background:var(--accent-soft);color:var(--accent)}.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-crit{background:var(--crit-soft);color:var(--crit)}.c-info{background:var(--info-soft);color:var(--info)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.msg{padding:11px 13px;border-radius:12px;font-size:14px;margin:0 0 10px}
.m-ok{background:var(--accent-soft);color:var(--accent)}.m-ng{background:var(--crit-soft);color:var(--crit)}.m-info{background:var(--warn-soft);color:var(--warn)}
.loading{color:var(--muted);text-align:center;padding:40px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 82px);z-index:20;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 16px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ログイン */
.login{padding:calc(env(safe-area-inset-top,0px) + 40px) 20px 40px;max-width:480px;margin:0 auto}
.login h1{font-size:26px;font-weight:900;margin:0}
.login p{color:var(--muted);margin:4px 0 20px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.names button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 10px;text-align:left}
.names b{display:block;font-size:17px}
.names span{font-size:12px;color:var(--muted)}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.pin-dots i.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 0;font-size:24px;font-family:var(--f-num)}
.pad button.ghost{border:0;background:none;font-size:15px;font-family:var(--f-ui);color:var(--muted)}

/* 一覧 */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.summary b{display:block;font-family:var(--f-num);font-size:22px;line-height:1.25}
.summary span{font-size:11.5px;color:var(--muted)}
.pt{width:100%;text-align:left;display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:8px}
.pt .rm{font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--muted);text-align:center;border-right:1px solid var(--line);align-self:stretch;display:flex;align-items:center;justify-content:center}
.pt .nm{font-weight:900;font-size:17px}
.pt .sub{font-size:12.5px;color:var(--muted);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-rooms{font-size:13px;color:var(--muted);padding:6px 2px}

/* 詳細 */
.head{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.head .nm{font-weight:900;font-size:21px}
.head .meta{font-size:12.5px;color:var(--muted)}
.dx{margin-top:4px;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin:12px 0 10px}
.seg button{border:0;background:none;padding:8px 0;border-radius:8px;font-size:14px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:50px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl .t{font-family:var(--f-num);font-weight:600;font-size:15px}
.vals{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:14px}
.vals span b{font-weight:400;color:var(--muted);font-size:11.5px;margin-right:3px}
.memo{font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.due{border:1px dashed var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 11px;font-size:14px;margin-bottom:8px}
.due.late{border-color:var(--crit);background:var(--crit-soft);color:var(--crit)}
.fabs{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:7;display:flex;gap:10px}
.fab{border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:14px 20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.fab.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.fab svg{width:20px;height:20px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:0}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0;overflow-wrap:anywhere}
.links{display:grid;gap:8px;margin-top:12px}
.lnk{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.lnk.day{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lnk.night{background:var(--info);border-color:var(--info);color:#fff}
.med{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}
.med .t{font-family:var(--f-num);font-weight:600}
.med .d{font-size:12.5px;color:var(--muted)}
.med .go{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 14px}
.med .go:disabled{opacity:.5}
.med .ok{font-size:12.5px;color:var(--accent);font-weight:700;text-align:right}
.med.late{border-color:var(--crit)}

/* 記録シート */
.sheet{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
.panel h2{font-size:18px;margin:0}
.grp{margin-top:12px}
.grp p{margin:0 0 5px;font-size:13px;font-weight:700;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{flex:1 1 auto;min-width:58px;border:2px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 6px;font-size:16px}
.opt[aria-pressed="true"]{background:var(--info);border-color:var(--info);color:#fff;font-weight:700}
textarea,input[type=text],input[type=number],select{width:100%;border:2px solid var(--line);border-radius:11px;padding:10px;background:var(--surface)}
textarea{min-height:80px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row span{font-size:13px;color:var(--muted);white-space:nowrap}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:14px}
.btn{border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}.btn.pri:disabled{opacity:.5}
.btn.sub{background:var(--line);color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin:5px 0 0}

/* やること・申し送り */
.task{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:6px;width:100%;text-align:left}
.task .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line)}
.task.done{opacity:.55}.task.done .box{background:var(--accent);border-color:var(--accent)}
.task.late{border-color:var(--crit)}
.task .r{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.hand{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.hand .h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.hand p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.alerts{padding:8px 16px 0;display:grid;gap:6px}
.al{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-radius:12px;padding:9px 11px;font-size:14px;border:1px solid var(--crit);background:var(--crit-soft);color:var(--crit)}
.al.k-記録{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.al b{color:var(--ink)}
.al .kd{font-size:11.5px;font-weight:700;border:1px solid currentColor;border-radius:5px;padding:0 5px;margin-right:4px}
.al-b{display:flex;gap:6px}
.al-b button{border:0;border-radius:9px;padding:7px 10px;font-weight:700;font-size:13px;background:var(--surface);color:var(--ink)}
.al-b button.ok{background:var(--ink);color:var(--bg)}
.al-more{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.al-more button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 10px;font-size:13px}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-bottom:6px}
.ph{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--line);aspect-ratio:1/1}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-family:var(--f-num);font-size:11px;border-radius:5px;padding:0 5px}
.preview{width:100%;max-height:46vh;object-fit:contain;border-radius:12px;background:#000;margin-top:10px;display:block}
.viewer{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;color:#fff}
.viewer .vi{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vb{padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;gap:8px;background:#111}
.viewer .vm{font-size:14px}
.viewer .vbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.viewer button{border:0;border-radius:12px;padding:12px;font-weight:700;font-size:15px;background:#333;color:#fff}
.viewer button.del{background:#5a1f19;color:#ffb4a9}
.switch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.switch button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.switch button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px}

/* 横長画面（iPad 横向きなど） */
.only-wide{display:none}
@media (min-width: 900px){
  .only-wide{display:block}
  body{padding-left:92px}
  .app{max-width:1240px}
  .appbar{padding-left:24px;padding-right:24px}
  .alerts{padding:10px 24px 0;grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
  .al-more{grid-column:1/-1}
  .main{padding:16px 24px 110px}
  .main.narrow{max-width:820px}
  .tabbar{left:0;top:0;bottom:0;right:auto;width:92px;border-top:0;border-right:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 16px) 6px 16px}
  .tabbar .in{display:flex;flex-direction:column;gap:6px;max-width:none}
  .tabbar button{padding:12px 0;font-size:12.5px;border-radius:12px}
  .tabbar button[aria-current="page"]{background:var(--accent-soft)}
  .tabbar .badge{left:calc(50% + 8px);top:6px}
  .fabs{right:28px;bottom:28px}
  .toast{bottom:28px;left:calc(50% + 46px)}
  .summary{grid-template-columns:repeat(3,minmax(0,220px))}
  .pts{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
  .pts .pt{margin-bottom:0}
  .dgrid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
  .dside{position:sticky;top:72px}
  .dmain .seg{margin-top:0}
  .side-kv{margin-top:12px}
  .ph-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .sheet{align-items:center;padding:24px}
  .panel{max-width:920px;border-radius:22px;max-height:94%}
  .grps{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
  .opt{flex:0 1 auto;min-width:72px;padding:12px 14px}
  .preview{max-height:52vh}
  .viewer{left:0}
  .viewer .vb{flex-direction:row}
  .viewer .vbtn{max-width:420px}
}
</style>
</head>
<body>
<div id="root"></div>
<input type="file" id="photoIn" accept="image/*" hidden>
<script>
(function(){
"use strict";
var VER = "2026-10-17a";
var API = "https://script.google.com/macros/s/AKfycby6TkGE9BzoXnl8KNizC9Kw8Jt4rpPLwHs5SrqjEguwWM-0O31orwnZlrsYiWFZhWnmcw/exec";
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }
function nowHM(){ var d = new Date(); return d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2); }
function toMin(t){ var m = String(t || "").match(/^(\d{1,2}):(\d{2})$/); return m ? (+m[1]) * 60 + (+m[2]) : -1; }

var S = {
  token: ls("tok") || "", me: null, view: "list", room: "", tab: "経過",
  rooms: null, at: "", patient: null, todo: null, hand: null,
  staff: null, loginName: "", pin: "", loginErr: "", busy: false,
  sheet: null, toast: "", alerts: [], photo: null, viewer: null
};
var CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
try { S.me = JSON.parse(ls("me") || "null"); } catch (e) {}
var qRoom = (location.search.match(/[?&]room=([^&]+)/) || [])[1];
if (qRoom) { S.view = "detail"; S.room = decodeURIComponent(qRoom); }

function api(action, data){
  var body = Object.assign({}, data || {}, { action: action, token: S.token });
  return fetch(API, { method: "POST", body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(r){
      if (r && r.auth === false) { logout(true); throw new Error("ログインの期限が切れました。もう一度ログインしてください"); }
      return r;
    });
}
var tt;
function toast(m){ S.toast = m; render(); clearTimeout(tt); tt = setTimeout(function(){ S.toast = ""; render(); }, 2600); }
function fail(e){ S.busy = false; toast("通信できませんでした：" + (e && e.message ? e.message : e)); }

/* ---------- ログイン ---------- */
function vLogin(){
  if (!S.staff) {
    api("staff").then(function(r){ S.staff = r.staff || []; render(); }).catch(function(e){ S.staff = []; S.loginErr = "通信できませんでした。電波を確認して開き直してください"; render(); });
    return '<div class="login"><h1>入院管理</h1><p>読み込み中…</p></div>';
  }
  var h = '<div class="login"><h1>入院管理</h1>';
  if (!S.loginName) {
    h += '<p>自分の名前を選んでください</p>';
    if (S.loginErr) h += '<div class="msg m-ng">' + esc(S.loginErr) + '</div>';
    if (!S.staff.length && !S.loginErr) h += '<div class="msg m-info">スタッフが登録されていません。院長に連絡してください。</div>';
    h += '<div class="names">' + S.staff.map(function(s){ return '<button data-login="' + esc(s.name) + '"><b>' + esc(s.name) + '</b><span>' + esc(s.role) + '</span></button>'; }).join("") + '</div>';
  } else {
    h += '<p><b>' + esc(S.loginName) + '</b> さん、暗証番号を入れてください</p>';
    if (S.loginErr) h += '<div class="msg m-ng">' + esc(S.loginErr) + '</div>';
    h += '<div class="pin-dots">' + [0,1,2,3].map(function(i){ return '<i class="' + (i < S.pin.length ? "on" : "") + '"></i>'; }).join("") + '</div>';

function shrink(file, max, q){
  return new Promise(function(ok, ng){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok({ url: c.toDataURL("image/jpeg", q), w: c.width, h: c.height });
    };
    img.onerror = function(){ URL.revokeObjectURL(url); ng(new Error("この写真は読み込めませんでした")); };
    img.src = url;
  });
}

function checkAlerts(){
  var fresh = activeAlerts().filter(function(a){ return !rung[a.k]; });
  if (!fresh.length) return;
  fresh.forEach(function(a){ rung[a.k] = 1; });
  if (ls("snd") !== "off") beep();
  if (ls("vib") !== "off" && navigator.vibrate) { try { navigator.vibrate([250, 120, 250]); } catch (e) {} }
  if (document.hidden) sysNotify(fresh);
}
var actx = null;
document.addEventListener("pointerdown", function(){
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {}
}, true);
function beep(){
  if (!actx) return;
  try {
    [0, 0.28].forEach(function(t){
      var o = actx.createOscillator(), g = actx.createGain(), s = actx.currentTime + t;
      o.type = "sine"; o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.35, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.2);
      o.start(s); o.stop(s + 0.22);
    });
  } catch (e) {}
}
function sysNotify(list){
  if (!("Notification" in window) || Notification.permission !== "granted" || !navigator.serviceWorker) return;
  var a = list[0], more = list.length > 1 ? "（ほか" + (list.length - 1) + "件）" : "";
  navigator.serviceWorker.ready.then(function(reg){
    reg.showNotification("入院管理：" + KIND[a.kind], { body: "部屋" + a.room + " " + a.name + "：" + a.text + more, tag: "nyuin", renotify: true, icon: "icon-192.png", data: { url: "?room=" + encodeURIComponent(a.room) } });
  }).catch(function(){});
}
function vAlerts(){
  var list = activeAlerts();
  if (!list.length) return "";
  var h = '<div class="alerts" role="alert">';
  list.slice(0, 3).forEach(function(a){
    h += '<div class="al k-' + a.kind + '"><div><span class="kd">' + KIND[a.kind] + '</span><b>部屋' + esc(a.room) + ' ' + esc(a.name) + '</b>　' + esc(a.text) + '</div>'
      + '<div class="al-b"><button data-room="' + esc(a.room) + '" data-tabgo="' + (a.kind === "投薬" ? "投薬" : "経過") + '">開く</button><button class="ok" data-alok="' + esc(a.k) + '">確認</button></div></div>';
  });
  if (list.length > 1) h += '<div class="al-more"><span>' + (list.length > 3 ? "ほか " + (list.length - 3) + " 件" : "") + '</span><button data-act="alAll">すべて確認（' + list.length + '件）</button></div>';
  return h + '</div>';
}
var pendingRender = false;
function safeRender(){
  var a = document.activeElement;
  if (S.sheet || S.photo || S.viewer || (a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName))) { pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", function(){ setTimeout(function(){ if (pendingRender && !S.sheet && !S.photo && !S.viewer) { pendingRender = false; var a = document.activeElement; if (!(a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName))) render(); } }, 300); });

/* ---------- やること ---------- */
function loadTodo(){ return api("todo").then(function(r){ if (!r.ok) throw new Error(r.error); S.todo = r; render(); }); }
function vTodo(){
  if (!S.todo) { loadTodo().catch(fail); return frame("やること", '<div class="loading">読み込み中…</div>', { right: REFRESH }); }
  var items = S.todo.items, h = "";
  var left = items.filter(function(x){ return !x.done; }).length;
  h += '<p class="sec">今日の残り ' + left + ' 件（' + esc(S.todo.now) + ' 時点）</p>';
  if (!items.length) h += '<div class="msg m-info">今日の予定はありません（本日の入院管理シートがある患者だけが対象です）</div>';
  var last = null;
  items.forEach(function(x){
    if (x.t !== last) { h += '<p class="sec num">' + esc(x.t || "時刻なし") + '</p>'; last = x.t; }
    h += '<button class="task' + (x.done ? ' done' : '') + (x.late ? ' late' : '') + '" data-room="' + esc(x.room) + '" data-tabgo="' + (x.kind === "投薬" ? "投薬" : "経過") + '"><span class="box"></span><span><b>' + esc(x.name) + '</b> ' + esc(x.text)
      + (x.late ? ' <span class="chip c-crit">遅れ</span>' : '') + (x.by ? ' <span class="chip c-ok">' + esc(x.by) + '</span>' : '') + '</span><span class="r">部屋' + esc(x.room) + '</span></button>';
  });
  return frame("やること", h, { right: REFRESH });
}

/* ---------- 申し送り ---------- */
function loadHand(){ return api("hand").then(function(r){ if (!r.ok) throw new Error(r.error); S.hand = r.items; render(); }); }
var handDraft = { text: "", room: "" };
function vHand(){
  var h = '<div class="card"><label class="sec" for="handTxt" style="display:block;margin-top:0">新しい申し送り</label><textarea id="handTxt" placeholder="次のスタッフへ伝えること（マイクで音声入力できます）">' + esc(handDraft.text) + '</textarea>'
    + '<div class="row"><span>部屋</span><select id="handRoom"><option value="">全体</option>' + (S.rooms || []).filter(isOcc).map(function(r){ return '<option value="' + esc(r.room) + '"' + (handDraft.room === r.room ? " selected" : "") + '>部屋 ' + esc(r.room) + '　' + esc(r.name) + '</option>'; }).join("") + '</select></div>'
    + '<div class="btns"><span></span><button class="btn pri" data-act="sendHand"' + (S.busy ? " disabled" : "") + '>' + (S.busy ? "送信中…" : "送る") + '</button></div></div>';
  if (!S.hand) { loadHand().catch(fail); h += '<div class="loading">読み込み中…</div>'; }
  else {
    h += '<p class="sec">最近2日間</p>';
    if (!S.hand.length) h += '<div class="msg m-info">申し送りはまだありません</div>';
    S.hand.forEach(function(x){ h += '<div class="hand"><div class="h"><span>' + esc(x.by) + (x.room ? '・部屋 ' + esc(x.room) : '') + '</span><span class="num">' + esc(x.at) + '</span></div><p>' + esc(x.text) + '</p></div>'; });
  }
  if (!S.rooms) loadList().catch(function(){});
  return frame("申し送り", h, { right: REFRESH });
}
function sendHand(){
  handDraft.text = $("handTxt").value; handDraft.room = $("handRoom").value;
  if (!handDraft.text.trim()) { toast("伝える内容を入力してください"); return; }
  S.busy = true; render();
  api("handAdd", { text: handDraft.text, room: handDraft.room }).then(function(r){
    S.busy = false;
    if (!r.ok) { toast(r.error || "送れませんでした"); return; }
    S.hand = r.items; handDraft = { text: "", room: "" }; toast(r.msg || "送りました");
  }).catch(fail);
}

/* ---------- 自分 ---------- */
function vMe(){
  var h = '<dl class="kv"><dt>ログイン中</dt><dd>' + esc(S.me.name) + '（' + esc(S.me.role || "スタッフ") + '）</dd></dl>';
  h += '<div class="links"><a class="lnk" href="' + API + '" target="_blank" rel="noopener">入院患者一覧（退院・部屋の移動）</a></div>';
  var np = "Notification" in window ? Notification.permission : "none";
  h += '<div class="card" style="margin-top:12px"><b>お知らせ</b><p class="hint" style="font-size:13px;margin-bottom:6px">アプリを開いている間、1分ごとに確認して、投薬・定時記録の30分以上の遅れと、気になる記録（元気×・食欲0・下痢・嘔吐）をお知らせします。</p>'
    + '<div class="switch"><span>音で知らせる</span><button data-act="tgSnd" aria-pressed="' + (ls("snd") !== "off") + '">' + (ls("snd") !== "off" ? "オン" : "オフ") + '</button></div>'
    + (navigator.vibrate ? '<div class="switch"><span>振動で知らせる</span><button data-act="tgVib" aria-pressed="' + (ls("vib") !== "off") + '">' + (ls("vib") !== "off" ? "オン" : "オフ") + '</button></div>' : '')
    + (np === "none" ? '' : '<div class="switch"><span>別のアプリを見ている時もスマホの通知で知らせる<br><small style="color:var(--muted)">Androidで有効。iPhoneは画面を開いている時だけ</small></span>' + (np === "granted" ? '<button aria-pressed="true" disabled>許可済み</button>' : np === "denied" ? '<button disabled>ブロック中</button>' : '<button data-act="askNotif">許可する</button>') + '</div>')
    + '<div class="switch"><span>確認済みにしたお知らせ</span><button data-act="alReset">元に戻す</button></div></div>';
  h += '<div class="card" style="margin-top:12px"><b>ホーム画面に追加すると便利です</b><p class="hint" style="font-size:13px">iPhone・iPad：Safari の共有ボタン →「ホーム画面に追加」<br>Android：Chrome のメニュー →「ホーム画面に追加」</p></div>';
  h += '<div class="links"><button class="btn sub" data-act="logout">ログアウト</button></div>';
  return frame("自分", h);
}

/* ---------- 画面の切り替え ---------- */
function go(v){ S.view = v; S.sheet = null; S.photo = null; S.viewer = null; if (v === "list") S.rooms = S.rooms; window.scrollTo(0, 0); render(); }
function render(){
  var h;
  if (!S.token || !S.me) h = vLogin();
  else {
    var V = { list: vList, detail: vDetail, todo: vTodo, hand: vHand, me: vMe };
    h = (V[S.view] || vList)();
    if (S.sheet && S.view === "detail") h += vSheet();
    if (S.photo && S.view === "detail") h += vPhotoSheet();
    if (S.viewer && S.view === "detail") h += vViewer();
  }
  if (S.toast) h += '<div class="toast" role="status">' + esc(S.toast) + '</div>';
  pendingRender = false;
  var y = window.scrollY, panel = document.querySelector(".panel"), py = panel ? panel.scrollTop : 0;
  $("root").innerHTML = h;
  window.scrollTo(0, y);
  var np = document.querySelector(".panel"); if (np) np.scrollTop = py;
}
document.addEventListener("click", function(e){
  var b = e.target.closest("button,[data-act]");
  if (!b) return;
  var d = b.dataset;
  if ((d.act === "sheetBg" || d.act === "photoBg") && e.target !== b) return;
  if (d.alok) { markSeen([d.alok]); return; }
  if (d.photo) { openViewer(d.photo); return; }
  if (d.login) { S.loginName = d.login; S.pin = ""; S.loginErr = ""; render(); return; }
  if (d.pin) { pinInput(d.pin); return; }
  if (d.go) { if (d.go === "list") S.rooms = S.rooms; go(d.go); if (d.go === "todo") { S.todo = null; render(); } if (d.go === "hand") { S.hand = null; render(); } return; }
  if (d.room) { S.sheet = null; S.photo = null; S.viewer = null; S.room = d.room; S.patient = null; S.tab = d.tabgo || "経過"; history.replaceState(null, "", "?room=" + encodeURIComponent(d.room)); go("detail"); return; }
  if (d.tab) { S.tab = d.tab; render(); return; }
  if (d.med) { doMed(+d.med); return; }
  if (d.time) { keepSheetInputs(); S.sheet.time = d.time; render(); return; }
  if (d.g) { keepSheetInputs(); var s = S.sheet; s.pick[d.g] = s.pick[d.g] === d.v ? undefined : d.v; render(); return; }
  switch (d.act) {
    case "pinBack": S.loginName = ""; S.pin = ""; S.loginErr = ""; render(); break;
    case "pinDel": S.pin = S.pin.slice(0, -1); render(); break;
    case "refresh": refresh(); break;
    case "openRec": openRec(); break;
    case "closeRec": case "sheetBg": keepSheetInputs(); S.sheet = null; render(); break;
    case "saveRec": saveRec(); break;
    case "sendHand": sendHand(); break;
    case "logout": logout(false); break;
    case "openPhoto": openPhoto(); break;
    case "closePhoto": case "photoBg": S.photo = null; render(); break;
    case "savePhoto": savePhoto(); break;
    case "closeViewer": S.viewer = null; render(); break;
    case "delPhoto": delPhoto(); break;
    case "alAll": markSeen(activeAlerts().map(function(a){ return a.k; })); break;
    case "alReset": ls("seen", null); rung = {}; toast("お知らせを元に戻しました"); break;
    case "tgSnd": ls("snd", ls("snd") === "off" ? "on" : "off"); if (ls("snd") !== "off") beep(); render(); break;
    case "tgVib": ls("vib", ls("vib") === "off" ? "on" : "off"); render(); break;
    case "askNotif": Notification.requestPermission().then(function(){ render(); }); break;
  }
});
document.addEventListener("input", function(e){
  if (e.target.id === "handTxt") handDraft.text = e.target.value;
  if (e.target.id === "handRoom") handDraft.room = e.target.value;
});
function refresh(){
  if (S.view === "list") { S.rooms = null; render(); }
  else if (S.view === "detail") { S.patient = null; S.busy = false; render(); }
  else if (S.view === "todo") { S.todo = null; render(); }
  else if (S.view === "hand") { S.hand = null; render(); }
}
window.addEventListener("popstate", function(){ go("list"); });
// 開いている間は1分ごとに確認（お知らせ用。入力中は画面を描き直さない）
setInterval(function(){
  if (!S.token || !S.me || S.busy) return;
  loadList(true).catch(function(){});
  if (S.view === "todo" && !document.hidden) loadTodo().catch(function(){});
}, 60000);
document.addEventListener("visibilitychange", function(){ if (!document.hidden && S.token && !S.sheet && !S.photo) { refresh(); if (S.view !== "list") loadList(true).catch(function(){}); } });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
// 新しい版が出ていたら自動で読み込み直す（入力中は待つ・10分に1回まで）
var lastVerCheck = 0;
function checkVersion(){
  if (Date.now() - lastVerCheck < 600000) return;
  lastVerCheck = Date.now();
  fetch("index.html?v=" + Date.now(), { cache: "no-store" }).then(function(r){ return r.text(); }).then(function(t){
    var m = t.match(/var VER = "([^"]+)"/);
    if (!m || m[1] === VER || S.sheet || S.photo || S.busy) return;
    if (ls("reloadedFor") === m[1]) return;
    ls("reloadedFor", m[1]); location.reload();
  }).catch(function(){});
}
checkVersion();
document.addEventListener("visibilitychange", function(){ if (!document.hidden) checkVersion(); });
render();
if (S.token && S.me && S.view !== "list") loadList(true).catch(function(){});
})();
</script>
</body>
